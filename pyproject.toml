[project]
name = "sideword"
version = "0.1.0"
description = "Python source stored separately from its documentation"
readme = "FORMAT.md"
requires-python = ">=3.14"

# The harness is deliberately close to the standard library: the stripper, the
# anchorer, the sidedoc and index writers, the round trip and the converter all
# run on stdlib alone. These two are needed only by `harness/instances.py`, which
# pulls the SWE-bench Verified parquet from Hugging Face to select instances —
# a step that runs once and whose output (`corpus/instances.json`) is committed.
dependencies = [
    "huggingface-hub>=1.27",
    "pyarrow>=25.0",
]

[project.optional-dependencies]
# Nothing yet. Tests are stdlib `unittest`; run them with
#   uv run python -m unittest discover -s harness/tests -t .
dev = []

# `harness/evaluate.py` only. Two pins, and both are pins on purpose:
#
#   mini-swe-agent  is the agent the experiment runs. The whole point of picking it
#                   was that its tool surface is small enough to read; a floating
#                   version could change that surface between arms of one sweep.
#   swebench        supplies the test command, the log parsers and the definition of
#                   "resolved". 4.1.0 is the last line that still carries
#                   MAP_REPO_VERSION_TO_SPECS in-tree, which is what the classic
#                   `sweb.eval.x86_64.*` images were built against; 5.x moved those
#                   specs into the dataset row and no longer matches these images.
#
# Kept out of the base dependency set so a cold clone can still run the converter
# and the test suite without pulling 77 packages. Run the evaluator with:
#   uv run --extra eval python -m harness.evaluate ...
eval = [
    "mini-swe-agent==2.4.6",
    "swebench==4.1.0",
]

[tool.uv]
# 3.14 is not optional. `harness/strip.py` and the anchorer rely on 3.12+ syntax,
# and a system 3.9/3.10 fails at import. `uv python install 3.14` provides it
# without touching the system interpreter.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
