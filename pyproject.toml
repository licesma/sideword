[project]
name = "sideword"
version = "0.1.0"
description = "Python source stored separately from its documentation"
readme = "FORMAT.md"
requires-python = ">=3.14"

# The harness is deliberately close to the standard library: the stripper, the
# anchorer, the sidedoc and index writers, the round trip and the converter all
# run on stdlib alone. These two are needed only by `harness/instances.py`, which
# pulls the SWE-bench Verified parquet from Hugging Face to select instances —
# a step that runs once and whose output (`corpus/instances.json`) is committed.
dependencies = [
    "huggingface-hub>=1.27",
    "pyarrow>=25.0",
]

[project.optional-dependencies]
# Nothing yet. Tests are stdlib `unittest`; run them with
#   uv run python -m unittest discover -s harness/tests -t .
dev = []

[tool.uv]
# 3.14 is not optional. `harness/strip.py` and the anchorer rely on 3.12+ syntax,
# and a system 3.9/3.10 fails at import. `uv python install 3.14` provides it
# without touching the system interpreter.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
