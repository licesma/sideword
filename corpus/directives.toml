pattern = "^#\\s*(For details:|Copyright \\(c\\)) https://github\\.com/PyCQA/pylint/blob/main/(LICENSE|CONTRIBUTORS\\.txt)"
kind = "regex"
tool = "pylint repo license header (pre-commit copyright-notice hook, not a linter directive)"
provenance = "342 comments in pylint-6528 (lines 2-3 of every file). The header is enforced by pre-commit `copyright-notice --enforce-all`, i.e. it would be re-added by the hook; no test reads it."

[[human]]
